name: Build and Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version and project targets
        run: |
          xcodebuild -version
          xcodebuild -list -project ResearchNotebook.xcodeproj

      - name: Build
        run: scripts/build.sh

      - name: Test built app settings
        run: python3 scripts/test-ci.py
